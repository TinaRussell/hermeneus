name: CI

on:
  pull_request:
  push:
    paths-ignore:
    - '**.org' # will need to remove this once I get tangling working with GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest # TODO add more OSes (using a matrix, presumably)
    strategy:
      matrix:
        emacs_version:
          - 25.1
          - 25.2
          - 25.3
          - 26.1
          - 26.2
          - 26.3
          - 27.1
          - 27.2
          - 28.1
          - 28.2
          - 29.1
          - 29.2
          - 29.3
          - 29.4
          - 30.1
          - 30.2
          - snapshot
    steps:
      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{matrix.emacs_version}}

      - name: Install Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Check out the source code
        uses: actions/checkout@v4

      - name: Test the project
        run: |
          eldev -p -dtT test
